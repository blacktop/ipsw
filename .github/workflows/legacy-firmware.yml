name: Legacy firmware

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios6:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Enable HFS+ kernel support
        run: |
          sudo modprobe loop
          if ! sudo modprobe hfsplus; then
            sudo apt-get update
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe hfsplus
          fi
      - name: Build
        run: env CGO_ENABLED=1 go build -o "$RUNNER_TEMP/ipsw-legacy" ./cmd/ipsw
      - name: Verify iOS 6.1.3 mount and extraction
        run: sudo unshare --mount --pid --kill-child --mount-proc --propagation private bash hack/ci/legacy-firmware.sh "$RUNNER_TEMP/ipsw-legacy" "$RUNNER_TEMP/legacy-firmware"
